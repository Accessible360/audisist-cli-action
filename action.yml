name: 'Audisist CLI Action'
description: 'Run accessibility validations against your website'
author: 'Allyant'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  auth_token:
    description: 'NPM token used to install @accessible360/audisist-cli'
    required: true
  license:
    description: 'License token for @accessible360/audisist-cli'
    required: true
  cli_version:
    description: 'Version of @accessible360/audisist-cli to install'
    required: false
    default: 'latest'
  config:
    description: 'Path to a JSON or YAML config file, or an inline JSON string'
    required: false
  debug:
    description: 'Enable debug mode'
    required: false
    default: 'false'
  url:
    description: 'URL to scan'
    required: false
  cookies:
    description: 'Cookies to include in the request, one per line in the format name=value'
    required: false
  headers:
    description: 'Headers to include in the request, one per line in the format name: value'
    required: false
  format:
    description: 'Output format (xunit, json, or silent)'
    required: false
  output:
    description: 'Path to write scan results'
    required: false
  on_before_script:
    description: 'Path to a JavaScript file to execute before validations'
    required: false
  ignore_response_code:
    description: 'Allow validations to run regardless of the HTTP response code'
    required: false
    default: 'false'
  fail_on:
    description: 'Fail the scan when issues at or above this priority are found (P1, P2, or P3)'
    required: false

outputs:
  outputs:
    description: 'JSON array of absolute paths to result files written by the scan'
    value: ${{ steps.validate.outputs.outputs }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@accessible360'

    - name: Install Audisist CLI
      shell: bash
      run: |
        # Install into an isolated prefix so we never touch the consumer's
        # package.json / lockfile. Running `npm install` in a pnpm/yarn
        # workspace (e.g. with workspace:* deps) would fail or corrupt it.
        INSTALL_DIR="${RUNNER_TEMP}/audisist-cli"
        mkdir -p "$INSTALL_DIR"
        npm install --prefix "$INSTALL_DIR" "@accessible360/audisist-cli@${{ inputs.cli_version }}"
        echo "$INSTALL_DIR/node_modules/.bin" >> "$GITHUB_PATH"
      env:
        NODE_AUTH_TOKEN: ${{ inputs.auth_token }}

    - name: Run accessibility validations
      id: validate
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js"
      # Composite actions do not auto-populate INPUT_* env vars for @actions/core
      env:
        INPUT_LICENSE: ${{ inputs.license }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_COOKIES: ${{ inputs.cookies }}
        INPUT_HEADERS: ${{ inputs.headers }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_ON_BEFORE_SCRIPT: ${{ inputs.on_before_script }}
        INPUT_IGNORE_RESPONSE_CODE: ${{ inputs.ignore_response_code }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
